name: Run Discord Bot

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Internal counter for quick restarts, leave as 0"
        required: false
        default: "0"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: discord-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  DEADLINE_MIN: "345"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start bot
        id: bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          start=$(date +%s)
          end=$(( start + DEADLINE_MIN * 60 ))
          export BOT_DEADLINE_EPOCH="$end"
          code=0
          timeout "$(( end - start ))" node index.cjs || code=$?
          echo "The bot stopped with code $code"
          echo "ran=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RAN: ${{ steps.bot.outputs.ran }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          ran=${RAN:-0}
          attempt=${ATTEMPT:-0}
          if [ "$ran" -lt 180 ]; then
            attempt=$(( attempt + 1 ))
            pause=$(( attempt * 300 ))
            if [ "$pause" -gt 3600 ]; then pause=3600; fi
            echo "The bot only lasted ${ran}s (quick stop number ${attempt}), waiting ${pause}s before the next run."
            sleep "$pause"
          else
            attempt=0
          fi
          waiting=$(gh run list --workflow bot.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$waiting" -gt 0 ]; then
            echo "A run is already waiting, not starting another."
          else
            gh workflow run bot.yml --ref main -f attempt="$attempt"
          fi
